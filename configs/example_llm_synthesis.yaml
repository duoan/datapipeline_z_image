# Example: LLM Synthesis Pipeline
#
# This pipeline reads seed prompts from a dataset, synthesizes responses via
# LLM, and writes the results (prompt + response + thinking) to Parquet.
#
# Two modes:
#   Online  - calls remote APIs (OpenAI, Claude, Gemini, DeepSeek, etc.)
#             with account pool + proxy pool for anti-throttling
#   Offline - runs models locally on GPUs via vLLM engine
#             no network overhead, maximum throughput

data_loader:
  type: HuggingFaceLoader
  params:
    dataset_name: "your-org/seed-prompts"
    split: "train"
    streaming: true
  num_workers: 2

stages:
  # ================================================================
  #  ONLINE MODE - remote API calls
  # ================================================================

  # ---- Claude with extended thinking ----
  - name: claude_synthesis
    operators:
      - name: llm_online_synthesis_refiner
        params:
          provider: anthropic
          model: claude-sonnet-4-20250514
          system_prompt: "You are a world-class expert. Think step by step."
          prompt_field: prompt
          # image_field: image   # uncomment for vision tasks

          response_field: llm_response
          thinking_field: llm_thinking
          model_field: llm_model
          usage_field: llm_usage
          error_field: llm_error

          max_tokens: 8192
          temperature: 0.7
          enable_thinking: true
          thinking_budget: 10000

          # Account pool - rotate API keys for higher throughput
          accounts:
            - api_key: "${ANTHROPIC_API_KEY_1}"
            - api_key: "${ANTHROPIC_API_KEY_2}"
          # accounts_file: "secrets/anthropic_accounts.jsonl"

          # Proxy pool - rotate proxies to avoid IP throttling
          # proxies:
          #   - "http://user:pass@proxy1.example.com:8080"
          #   - "socks5://user:pass@proxy2.example.com:1080"
          # proxies_file: "secrets/proxies.txt"

          max_concurrent: 8
          retry_attempts: 3
          request_timeout: 120.0
    worker:
      num_replicas: 1
      resources:
        cpu: 2

  # ---- OpenAI GPT-4o with vision ----
