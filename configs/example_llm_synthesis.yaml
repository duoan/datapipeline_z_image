data_writer:
  type: ParquetDataWriter
  params:
    output_path: "./llm_synthesis_output"
    table_name: "synthesized_data"

executor:
  max_samples: 10000
  batch_size: 64    # for online mode, this is the HTTP concurrency batch
                    # for offline mode, vLLM handles internal batching

# ---------- File Formats ----------
#
# accounts_file (JSONL, one account per line):
#   {"api_key": "sk-ant-key1"}
#   {"api_key": "sk-ant-key2", "base_url": "https://custom-endpoint.com"}
#   {"api_key": "sk-key3", "org_id": "org-xxx"}
#
# proxies_file (text, one URL per line):
#   http://user:pass@proxy1.example.com:8080
#   socks5://user:pass@proxy2.example.com:1080
#   http://proxy3.example.com:3128
