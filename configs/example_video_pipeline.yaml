# Data source
data_loader:
  type: HuggingFaceLoader
  params:
    dataset_name: "TIGER-Lab/VideoFeedback"
    subset: "annotated"
    split: "train"
  # Note: This dataset has only 1 parquet file, so using 1 worker is optimal.
  # With multiple workers, max_samples is divided among workers, but only 1 worker
  # gets the file, resulting in fewer total samples loaded.
  num_workers: 1  # Use 1 worker for single-file datasets
  checkpoint_interval: 1000  # Checkpoint every 1000 records per worker

# Processing stages
stages:
  # Stage 1: Basic metadata and extact dedup
  - name: metadata_exact_dedup
    operators:
      - name: video_metadata_refiner
        params:
          video_url_field: "video link"
          max_file_size: 1073741824  # 1GB limit
          include_full_metadata: true
      - name: video_exact_byte_level_deduplicator
        params:
          video_url_field: "video link"
      - name: video_exact_stream_level_deduplicator
        params:
          video_url_field: "video link"
    worker:
      min_replicas: 2  # Can start with just 1 worker
      max_replicas: 4  # Will use up to 4 if CPUs available
      resources:
        cpu: 1

  # Stage 2: Video aesthetic scoring (OpenVid-1M style multi-frame sampling)
  - name: video_aesthetic_scoring
    operators:
      - name: video_aesthetic_score_refiner
        params:
          video_url_field: "video link"
          use_precomputed_embeddings: false  # Direct video processing
          num_frames: 8  # Sample 8 frames uniformly across the video
          score_aggregation: "mean"  # Average the scores
          clip_model_name: "ViT-L-14"
          clip_pretrained: "openai"
          use_fp16: true
      # Filter out videos with low aesthetic scores
      - name: range_filter
        params:
          field: "video_aesthetic_score"
          min_value: 4.5  # Keep videos with aesthetic score >= 4.5
          keep_missing: false  # Reject videos where scoring failed
    worker:
      min_replicas: 1
      max_replicas: 12
      resources:
        cpu: 1
        gpu: 0.33  # GPU recommended for CLIP inference

# Output
data_writer:
  type: ParquetDataWriter
  params:
    output_path: "./output/VideoFeedback/parquet_data"
    table_name: "video_metadata"

# Execution settings
executor:
  max_samples: 1000
  batch_size: 10
  dedup_num_buckets: 1

  # Rejected samples collection (for deep dive analysis)
  rejected_samples:
    enabled: true
    output_path: "./output/VideoFeedback/parquet_data_rejected"

  # Metrics configuration
  metrics:
    enabled: true
    output_path: "./output/VideoFeedback/metrics"
    collect_custom_metrics: false
    write_on_completion: true
    generate_report: true  # Generate HTML report
